<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LatinSoft Pedidos — Prototipo funcional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/@zxing/library@0.23.0/umd/index.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  --char-900:#15100D; --char-800:#1E1713; --char-700:#2A211A; --char-600:#3A2E25; --char-500:#4D3D30;
  --ember-500:#C24A26; --ember-600:#A53D1E; --ember-300:#E07A52;
  --gold-500:#D9A441; --gold-300:#EBCB8E; --gold-700:#8A6626;
  --cream-050:#F6F0E3; --cream-100:#EFE4CC; --cream-200:#E4D5B3;
  --ink-900:#241A12; --ink-700:#4A392C; --ink-500:#7A6552;
  --verde-600:#3F7D52; --verde-100:#DCEBE0;
  --azul-600:#3E6B8A; --azul-100:#DCE7EE;
  --plum-600:#6B4C7A; --plum-100:#E6DCEA;
  --gris-600:#8C8275; --gris-100:#E8E3DA;
  --rojo-600:#B8402C; --rojo-100:#F3DCD5;
  --radius-s:6px; --radius-m:10px; --radius-l:16px;
  --shadow-card:0 1px 2px rgba(21,16,13,.18), 0 6px 16px -8px rgba(21,16,13,.35);
  --font-display:'Fraunces', Georgia, serif;
  --font-ui:'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0; min-height:100%; background:var(--char-900); color:var(--cream-050);
  font-family:var(--font-ui); -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit;}
.num{font-variant-numeric:tabular-nums;}
::selection{background:var(--gold-300); color:var(--ink-900);}

/* ---------- Chrome de la página ---------- */
#page-shell{display:flex; flex-direction:column; min-height:100vh;}
#app-topbar{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:14px 20px; padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:var(--char-800); border-bottom:1px solid var(--char-600);
  position:sticky; top:0; z-index:40;
}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto;}
.brand-mark{font-family:var(--font-display); font-weight:700; font-size:21px; color:var(--cream-050); letter-spacing:.2px;}
.brand-sub{font-size:12px; color:var(--ink-500); color:#A9977F;}
.live-dot{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:#9FD6B2; padding:4px 10px; border-radius:999px; background:rgba(63,125,82,.18); border:1px solid rgba(63,125,82,.4);}
.live-dot::before{content:''; width:7px; height:7px; border-radius:50%; background:#49C97A; box-shadow:0 0 0 0 rgba(73,201,122,.6); animation:pulse 2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(73,201,122,.55);}70%{box-shadow:0 0 0 7px rgba(73,201,122,0);}100%{box-shadow:0 0 0 0 rgba(73,201,122,0);}}
.clockface{font-size:13px; color:#C9BBA6; font-variant-numeric:tabular-nums;}

.segctrl{display:inline-flex; background:var(--char-700); border:1px solid var(--char-600); border-radius:999px; padding:3px; gap:2px;}
.segctrl button{
  border:none; background:transparent; color:#B8A991; font-size:13px; font-weight:600;
  padding:7px 14px; border-radius:999px; transition:background .15s, color .15s;
}
.segctrl button.active{background:var(--ember-500); color:#fff;}
.segctrl button:not(.active):hover{color:#F0E6D4;}

.btn{
  border:1px solid var(--char-500); background:var(--char-700); color:var(--cream-100);
  padding:8px 14px; border-radius:var(--radius-m); font-size:13px; font-weight:600;
  transition:transform .08s ease, background .15s, border-color .15s;
}
.btn:hover{background:var(--char-600); border-color:var(--gold-500);}
.btn:active{transform:scale(.97);}
.btn-ember{background:var(--ember-500); border-color:var(--ember-500); color:#fff;}
.btn-ember:hover{background:var(--ember-600); border-color:var(--ember-600);}
.btn-gold{background:var(--gold-500); border-color:var(--gold-500); color:#2A1D08;}
.btn-gold:hover{background:#C7912F;}
.btn-ghost{background:transparent; border-color:var(--char-500);}
.btn-danger{background:transparent; border-color:var(--rojo-600); color:#F0A997;}
.btn-danger:hover{background:rgba(184,64,44,.15);}
.btn-sm{padding:5px 10px; font-size:12px; border-radius:var(--radius-s);}
.btn-block{width:100%; display:block; text-align:center;}
.btn[disabled]{opacity:.4; cursor:not-allowed; transform:none !important;}

#app-main{flex:1; display:flex; justify-content:center; padding:22px 16px 60px;}
.hidden{display:none !important;}

/* ---------- Toasts ---------- */
#toast-stack{position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); right:16px; z-index:200; display:flex; flex-direction:column; gap:8px; max-width:320px;}
.toast{
  background:var(--char-700); border:1px solid var(--gold-500); color:var(--cream-050);
  padding:10px 14px; border-radius:var(--radius-m); font-size:13px; box-shadow:var(--shadow-card);
  animation:toastin .2s ease;
}
.toast b{color:var(--gold-300);}
@keyframes toastin{from{opacity:0; transform:translateY(-6px);}to{opacity:1; transform:translateY(0);}}

/* ================= MESERO (teléfono) ================= */
#vista-mesero{width:100%; max-width:960px; display:flex; justify-content:center;}
.phone{
  width:100%; max-width:392px; background:var(--cream-050); color:var(--ink-900);
  border-radius:34px; border:9px solid var(--char-900); box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
  overflow:hidden; display:flex; flex-direction:column; min-height:720px; position:relative;
}
.phone-status{display:flex; justify-content:space-between; align-items:center; padding:9px 18px 4px; font-size:12px; font-weight:600; color:var(--ink-700);}
.phone-status .online{display:flex; align-items:center; gap:5px; color:var(--verde-600);}
.phone-status .online::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--verde-600);}
.m-header{padding:4px 18px 14px; border-bottom:1px solid var(--cream-200);}
.m-header h1{font-family:var(--font-display); font-size:19px; margin:0 0 2px; font-weight:700;}
.m-header .sub{font-size:12.5px; color:var(--ink-500);}
.m-body{flex:1; overflow-y:auto; padding:16px 18px 10px; -webkit-overflow-scrolling:touch;}
.m-tabbar{
  display:flex; border-top:1px solid var(--cream-200); background:var(--cream-050);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.m-tab{flex:1; border:none; background:transparent; padding:10px 4px 9px; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink-500); font-size:10.5px; font-weight:600;}
.m-tab .ic{font-size:19px; line-height:1;}
.m-tab.active{color:var(--ember-600);}

/* Login */
.login-wrap{display:flex; flex-direction:column; align-items:center; padding:30px 10px 10px; text-align:center;}
.login-logo{width:54px; height:54px; border-radius:16px; background:var(--ember-500); color:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; margin-bottom:12px;}
.login-wrap h1{font-family:var(--font-display); font-size:22px; margin:0 0 2px;}
.login-wrap .sub{font-size:12.5px; color:var(--ink-500); margin-bottom:22px;}
.user-pick{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; justify-content:center;}
.user-chip{
  border:1.5px solid var(--cream-200); background:#fff; border-radius:999px; padding:7px 13px;
  font-size:13px; font-weight:600; color:var(--ink-700);
}
.user-chip.active{border-color:var(--ember-500); background:var(--ember-500); color:#fff;}
.pin-dots{display:flex; gap:12px; margin-bottom:22px;}
.pin-dot{width:13px; height:13px; border-radius:50%; border:1.5px solid var(--ink-500);}
.pin-dot.filled{background:var(--ember-500); border-color:var(--ember-500);}
.pin-error{color:var(--rojo-600); font-size:12.5px; margin:-12px 0 16px; font-weight:600;}
.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:260px;}
.key{
  background:#fff; border:1px solid var(--cream-200); border-radius:var(--radius-m);
  font-size:19px; font-weight:600; padding:14px 0; color:var(--ink-900);
}
.key:active{background:var(--cream-100);}
.key.wide{font-size:13px; font-weight:700; color:var(--ember-600);}
.login-demo{margin-top:20px; font-size:11px; color:var(--ink-500); line-height:1.6;}

/* Mesas */
.mesas-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.mesas-head h2{font-size:16px; margin:0;}
.mesas-head .who{font-size:12px; color:var(--ink-500);}
.leyenda{display:flex; flex-wrap:wrap; gap:9px; margin-bottom:16px;}
.leyenda span{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; color:var(--ink-500);}
.leyenda i{width:9px; height:9px; border-radius:50%; display:inline-block;}
.mesas-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.mesa-circ{
  aspect-ratio:1; border-radius:50%; border:none; display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#fff; font-weight:700; font-size:17px; position:relative; min-height:64px;
}
.mesa-circ small{font-size:9px; font-weight:600; opacity:.9; margin-top:1px;}
.mesa-circ.mine-ring{box-shadow:0 0 0 3px var(--ink-900);}
.mesa-ini{position:absolute; top:-4px; right:-2px; background:var(--char-900); color:#fff; font-size:9px; padding:2px 5px; border-radius:999px; font-weight:700;}

/* Pedido actual */
.pedido-topbar{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
.pedido-topbar h2{font-size:16px; margin:0; flex:1;}
.ronda-prev{background:var(--cream-100); border-radius:var(--radius-m); padding:10px 12px; margin-bottom:10px;}
.ronda-prev .rh{display:flex; justify-content:space-between; font-size:11.5px; font-weight:700; color:var(--ink-700); margin-bottom:4px;}
.ronda-prev .estado-pill{font-size:10px;}
.line-item{display:flex; justify-content:space-between; font-size:12.5px; padding:2px 0; color:var(--ink-700);}
.carrito-empty{text-align:center; padding:40px 10px; color:var(--ink-500);}
.carrito-empty .big{font-size:34px; margin-bottom:8px;}
.cart-item{background:#fff; border:1px solid var(--cream-200); border-radius:var(--radius-m); padding:11px 12px; margin-bottom:9px;}
.cart-item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.cart-item-name{font-weight:600; font-size:13.5px;}
.cart-item-price{font-size:11.5px; color:var(--ink-500);}
.cart-item-obs{font-size:11.5px; color:var(--ember-600); font-weight:600; margin-top:3px;}
.qty-ctrl{display:flex; align-items:center; gap:9px; margin-top:8px;}
.qty-btn{width:28px; height:28px; border-radius:8px; border:1px solid var(--cream-200); background:var(--cream-050); font-size:15px; font-weight:700; line-height:1;}
.qty-val{min-width:18px; text-align:center; font-weight:700; font-size:13.5px;}
.cart-item-actions{display:flex; gap:8px; margin-left:auto;}
.icon-btn{border:none; background:transparent; font-size:14px; color:var(--ink-500); padding:4px;}
.obs-chip-row{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0;}
.obs-chip{border:1px solid var(--cream-200); background:#fff; border-radius:999px; padding:5px 10px; font-size:11px; font-weight:600; color:var(--ink-700);}
.obs-chip.sel{background:var(--ember-500); border-color:var(--ember-500); color:#fff;}
.cart-summary{display:flex; justify-content:space-between; font-size:13px; padding:10px 2px; border-top:1px dashed var(--cream-200); margin-top:4px;}
.cart-total{font-weight:700; font-size:15px;}
.sticky-actions{position:sticky; bottom:0; background:linear-gradient(to top, var(--cream-050) 70%, transparent); padding-top:14px; display:flex; flex-direction:column; gap:8px;}

/* Escáner overlay */
.scanner-ov{position:fixed; inset:0; background:#0E0B09; color:#fff; display:flex; flex-direction:column; z-index:500;}
.scanner-ov.hidden{display:none;}
.scanner-video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000;}
.viewfinder{z-index:1;}
.viewfinder .vf-corner, .viewfinder .vf-laser, .viewfinder .vf-hint{z-index:2;}
.scanner-aviso{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 30px; font-size:13px; color:#E0D3BE; background:rgba(14,11,9,.85); z-index:3;}
.torch-btn{position:absolute; top:10px; right:10px; z-index:4; width:38px; height:38px; border-radius:50%; border:1px solid rgba(255,255,255,.3); background:rgba(0,0,0,.4); color:#fff; font-size:16px;}
.torch-btn.on{background:var(--gold-500); color:#2A1D08; border-color:var(--gold-500);}
.scanner-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px));}
.scanner-head h3{margin:0; font-size:15px; font-weight:700;}
.viewfinder{margin:4px 22px 14px; aspect-ratio:4/3; position:relative; border-radius:18px; background:#1B1512; overflow:hidden; display:flex; align-items:center; justify-content:center;}
.vf-corner{position:absolute; width:26px; height:26px; border-color:var(--gold-500); border-style:solid;}
.vf-tl{top:14px; left:14px; border-width:3px 0 0 3px; border-radius:6px 0 0 0;}
.vf-tr{top:14px; right:14px; border-width:3px 3px 0 0; border-radius:0 6px 0 0;}
.vf-bl{bottom:14px; left:14px; border-width:0 0 3px 3px; border-radius:0 0 0 6px;}
.vf-br{bottom:14px; right:14px; border-width:0 3px 3px 0; border-radius:0 0 6px 0;}
.vf-laser{position:absolute; left:14px; right:14px; height:2px; background:var(--ember-500); box-shadow:0 0 8px 1px var(--ember-500); animation:laser 1.8s ease-in-out infinite;}
@keyframes laser{0%,100%{top:18%;}50%{top:78%;}}
.vf-hint{font-size:11.5px; color:#C9BBA6; z-index:2;}
.vf-flash{position:absolute; inset:0; background:var(--gold-300); opacity:0; pointer-events:none;}
.vf-flash.on{animation:flash .32s ease;}
@keyframes flash{0%{opacity:.85;}100%{opacity:0;}}
.scan-manual{display:flex; gap:7px; margin:0 22px 10px;}
.scan-manual input{flex:1; background:#241A14; border:1px solid #3A2E25; color:#fff; border-radius:var(--radius-m); padding:9px 11px; font-size:13px;}
.scan-list{flex:1; overflow-y:auto; padding:4px 16px 18px; background:var(--cream-050); border-radius:20px 20px 0 0;}
.scan-cat{font-size:11px; font-weight:700; letter-spacing:.3px; color:var(--ink-500); margin:14px 2px 7px;}
.scan-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
.scan-card{background:#fff; border:1px solid var(--cream-200); border-radius:var(--radius-m); padding:10px; text-align:left; color:var(--ink-900);}
.scan-card .nm{font-size:12.5px; font-weight:600; line-height:1.25;}
.scan-card .pr{font-size:11.5px; color:var(--ember-600); font-weight:700; margin-top:4px;}
.scan-card .cd{font-size:9.5px; color:var(--ink-500); font-variant-numeric:tabular-nums;}
.scan-card.added{border-color:var(--verde-600); background:var(--verde-100);}
.scan-footer{padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px)); background:var(--cream-050); display:flex; justify-content:space-between; align-items:center;}

/* Mis pedidos / confirmacion */
.mp-item{background:#fff; border:1px solid var(--cream-200); border-radius:var(--radius-m); padding:11px 13px; margin-bottom:9px;}
.mp-item-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
.mp-item .mesa-tag{font-weight:700; font-size:13.5px;}
.mp-item .time-ago{font-size:11px; color:var(--ink-500);}
.estado-pill{display:inline-block; padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:700;}
.confirm-wrap{text-align:center; padding:50px 14px;}
.confirm-wrap .big{font-size:50px; margin-bottom:12px;}
.confirm-wrap h2{font-family:var(--font-display); font-size:21px; margin:0 0 6px;}
.confirm-wrap p{font-size:13px; color:var(--ink-500); margin:0 0 24px;}

.perfil-card{background:#fff; border:1px solid var(--cream-200); border-radius:var(--radius-m); padding:18px; text-align:center;}
.perfil-avatar{width:56px; height:56px; border-radius:50%; background:var(--gold-500); color:#2A1D08; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:19px; margin:0 auto 10px;}

/* Modal genérico dentro del teléfono */
.m-modal-backdrop{position:absolute; inset:0; background:rgba(21,16,13,.55); display:flex; align-items:flex-end; z-index:70;}
.m-modal{background:#fff; color:var(--ink-900); width:100%; border-radius:20px 20px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px)); max-height:84%; overflow-y:auto;}
.m-modal h3{margin:0 0 4px; font-size:16px;}
.m-modal .mut{font-size:12px; color:var(--ink-500); margin-bottom:14px;}

/* ================= ADMIN ================= */
#vista-admin{width:100%; max-width:1280px;}
.admin-shell{display:flex; gap:0; background:var(--cream-050); color:var(--ink-900); border-radius:var(--radius-l); overflow:hidden; min-height:720px; box-shadow:var(--shadow-card);}
.admin-side{width:216px; background:var(--char-800); color:var(--cream-100); padding:18px 12px; display:flex; flex-direction:column; flex-shrink:0;}
.side-brand{display:flex; align-items:center; gap:9px; padding:4px 8px 18px;}
.side-brand .em{width:34px; height:34px; border-radius:9px; background:var(--ember-500); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; font-size:15px;}
.side-brand .nm{font-weight:700; font-size:13.5px; line-height:1.2;}
.side-brand .sub{font-size:10.5px; color:#A9977F;}
.side-nav{display:flex; flex-direction:column; gap:2px;}
.side-nav button{
  display:flex; align-items:center; gap:10px; text-align:left; background:transparent; border:none; color:#C9BBA6;
  padding:9px 11px; border-radius:var(--radius-m); font-size:13px; font-weight:600;
}
.side-nav button .ic{width:18px; text-align:center;}
.side-nav button.active{background:var(--ember-500); color:#fff;}
.side-nav button:not(.active):hover{background:var(--char-700); color:#F0E6D4;}
.side-foot{margin-top:auto; padding:10px 8px 0; font-size:11px; color:#A9977F; border-top:1px solid var(--char-600); padding-top:12px;}
.side-foot .foot-texto{display:block; margin-bottom:8px;}
.side-foot .btn{width:100%;}

.admin-main{flex:1; min-width:0; padding:22px 26px 36px; overflow-y:auto; max-height:720px;}
.admin-topline{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; gap:12px; flex-wrap:wrap;}
.admin-topline h2{font-size:19px; margin:0 0 2px;}
.admin-topline .mut{font-size:12.5px; color:var(--ink-500);}

.stat-row{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:20px;}
.stat-card{background:#fff; border:1px solid var(--cream-200); border-radius:var(--radius-m); padding:13px 14px;}
.stat-card .v{font-family:var(--font-display); font-size:23px; font-weight:700;}
.stat-card .l{font-size:11px; color:var(--ink-500); margin-top:2px;}

.filtro-row{display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
.filtro-row .lab{font-size:12px; color:var(--ink-500); font-weight:600;}
.chip-filtro{border:1px solid var(--cream-200); background:#fff; border-radius:999px; padding:5px 12px; font-size:12px; font-weight:600; color:var(--ink-700);}
.chip-filtro.active{background:var(--ink-900); border-color:var(--ink-900); color:#fff;}

.kanban{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; align-items:start;}
.kcol-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding:0 2px;}
.kcol-head h4{font-size:12.5px; margin:0; text-transform:none; letter-spacing:.2px; color:var(--ink-700);}
.kcol-count{background:var(--cream-200); color:var(--ink-700); font-size:11px; font-weight:700; padding:1px 8px; border-radius:999px;}
.kcol{background:#EFE6D4; border-radius:var(--radius-m); padding:9px; min-height:140px; display:flex; flex-direction:column; gap:9px;}
.kcard{background:#fff; border:1px solid var(--cream-200); border-radius:var(--radius-m); padding:11px 12px; box-shadow:0 1px 2px rgba(0,0,0,.05);}

<div id="page-shell">
  <div id="app-topbar">
    <div class="brand">
      <span class="brand-mark">🔥 LatinSoft Pedidos</span>
      <span class="brand-sub">Prototipo funcional — PRD MVP</span>

<script>
(function(){
'use strict';

/* ============================================================
   1) CONEXIÓN A SUPABASE
   ============================================================ */
// ⚠️ Reemplaza estos dos valores por los de tu proyecto de Supabase
// (Project Settings → API → Project URL / anon public key).
const SUPABASE_URL = 'https://wcysnzxijlnszofsrvkl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_FgSSYUmJbNjEGHIH4xpd3A_I3hm_2_9';
const RESTAURANTE_ID = 'rest-fogon';

const SUPABASE_CONFIGURADO = !SUPABASE_URL.includes('TU_SUPABASE') && !SUPABASE_ANON_KEY.includes('TU_SUPABASE');
let sb = null;
if (SUPABASE_CONFIGURADO && window.supabase && typeof window.supabase.createClient === 'function') {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

/* ---------- mapeo de filas de Supabase (snake_case) a los objetos que usa la UI (camelCase) ---------- */
function mapRestaurante(r){
  if(!r) return {nombre:'Restaurante', nit:'', direccion:'', porcentajeServicio:10, pieComprobante:''};
  return { nombre:r.nombre, nit:r.nit, direccion:r.direccion, porcentajeServicio:r.porcentaje_servicio, pieComprobante:r.pie_comprobante };
}
function mapProducto(p){ return { id:p.id, codigo:p.codigo, nombre:p.nombre, idCategoria:p.categoria_id, precio:Number(p.precio), estado:p.estado }; }
function mapMesero(m){ return { id:m.id, nombre:m.nombre, usuario:m.usuario, pin:m.pin, estado:m.estado, ultimoIngreso: m.ultimo_ingreso ? new Date(m.ultimo_ingreso).getTime() : null, rol: m.rol||'mesero' }; }
function mapMesa(m){ return { id:m.id, numero:m.numero, idPedidoActivo:m.pedido_activo_id }; }
function mapPago(p){ return { id:p.id, formaPago:p.forma_pago, valor:Number(p.valor), recibido: p.recibido!=null?Number(p.recibido):null, hora:new Date(p.hora).getTime() }; }
function mapRonda(r){
  return { id:r.id, numero:r.numero, idMesero:r.mesero_id, items:r.items||[], estado:r.estado,
    enviadoEn:new Date(r.enviado_en).getTime(), historial:r.historial||[], motivoAnulacion:r.motivo_anulacion };
}
function mapPedido(p){
  return {
    id:p.id, consecutivo:p.consecutivo, idMesa:p.mesa_id, meseroPrincipal:p.mesero_principal_id,
    estadoCuenta:p.estado_cuenta, servicioPct:p.servicio_pct, servicioAplicado:p.servicio_aplicado,
    descuento:Number(p.descuento), creadoEn:new Date(p.creado_en).getTime(),
    cuentaSolicitadaEn: p.cuenta_solicitada_en ? new Date(p.cuenta_solicitada_en).getTime() : null,
    pagadoEn: p.pagado_en ? new Date(p.pagado_en).getTime() : null,
    rondas: (p.rondas||[]).map(mapRonda).sort((a,b)=>a.numero-b.numero),
    pagos: (p.pagos||[]).map(mapPago),
  };
}

/* ---------- carga inicial + resincronización (se llama al arrancar y cada vez que llega un cambio en tiempo real) ---------- */
async function syncFromSupabase(){
  if(!sb) return {ok:false, motivo:'no_configurado'};
  try{
    const [rRestaurantes, rCategorias, rProductos, rMeseros, rMesas, rPedidos] = await Promise.all([
      sb.from('restaurantes').select('*').eq('id', RESTAURANTE_ID).limit(1),
      sb.from('categorias').select('*').eq('restaurante_id', RESTAURANTE_ID).order('orden'),
      sb.from('productos').select('*').eq('restaurante_id', RESTAURANTE_ID),
      sb.from('meseros').select('*').eq('restaurante_id', RESTAURANTE_ID),
      sb.from('mesas').select('*').eq('restaurante_id', RESTAURANTE_ID).order('numero'),
      sb.from('pedidos').select('*, rondas(*), pagos(*)').eq('restaurante_id', RESTAURANTE_ID),
    ]);
    const primerError = [rRestaurantes, rCategorias, rProductos, rMeseros, rMesas, rPedidos].find(r=>r.error);
    if(primerError) return {ok:false, motivo:'error_db', error:primerError.error};

    state.restaurante = mapRestaurante(rRestaurantes.data && rRestaurantes.data[0]);
    state.categorias = rCategorias.data || [];
    state.productos = (rProductos.data || []).map(mapProducto);
    state.meseros = (rMeseros.data || []).map(mapMesero);
    state.mesas = (rMesas.data || []).map(mapMesa);
    const nuevosPedidos = {};
    (rPedidos.data || []).forEach(p => { nuevosPedidos[p.id] = mapPedido(p); });
    state.pedidos = nuevosPedidos;
    return {ok:true};
  }catch(err){
    return {ok:false, motivo:'error_red', error:err};
  }
}

/* ---------- tiempo real: cualquier cambio en estas tablas dispara una resincronización ---------- */
let syncProgramado = false;
function programarResync(){
  if(syncProgramado) return;
  syncProgramado = true;
  setTimeout(async function(){
    syncProgramado = false;
    const r = await syncFromSupabase();
    if(r.ok) render();
  }, 300);
}
function iniciarTiempoReal(){
  if(!sb) return;
  const tablas = ['mesas','pedidos','rondas','pagos','productos','meseros'];
  const canal = sb.channel('latinsoft-sync');
  tablas.forEach(function(t){
    canal.on('postgres_changes', {event:'*', schema:'public', table:t}, programarResync);
  });
  canal.subscribe();
}

/* ============================================================
   2) LÓGICA DE ESTADO (probada con node antes de incrustarse)
   ============================================================ */
function getMesa(s,id){ return s.mesas.find(m=>m.id===id); }
function getProducto(s,id){ return s.productos.find(p=>p.id===id); }
function getMesero(s,id){ return s.meseros.find(m=>m.id===id); }
function getPedido(s,id){ return s.pedidos[id]; }
function estadoMesa(s,idMesa){
  const mesa=getMesa(s,idMesa); if(!mesa) return null;
  if(mesa.idPedidoActivo){
    const pedido=getPedido(s,mesa.idPedidoActivo);
    if(pedido.estadoCuenta==='cuenta_solicitada') return 'cuenta_solicitada';
    return 'enviado';
  }
  const carrito=s.carritos[idMesa];
  if(carrito && carrito.items.length>0) return 'abierto';
  return 'disponible';
}
function totalItem(it){ return it.cantidad*it.precioUnitario; }
function subtotalRonda(r){ return r.items.reduce((a,it)=>a+totalItem(it),0); }
function subtotalPedido(p){ return p.rondas.filter(r=>r.estado!=='anulado').reduce((a,r)=>a+subtotalRonda(r),0); }
function totalesPedido(p){
  const subtotal=subtotalPedido(p);
  const servicio=p.servicioAplicado?Math.round(subtotal*(p.servicioPct/100)):0;
  const descuento=p.descuento||0;
  const total=Math.max(0,subtotal+servicio-descuento);
  return {subtotal,servicio,descuento,total};
}
function abrirCarrito(s,idMesa,idMesero){
  if(!s.carritos[idMesa]) s.carritos[idMesa]={idMesero,items:[]};
  return s.carritos[idMesa];
}
function agregarProductoAlCarrito(s,idMesa,idMesero,idProducto){
  const producto=getProducto(s,idProducto);
  if(!producto) return {ok:false,motivo:'no_encontrado'};
  if(producto.estado!=='activo') return {ok:false,motivo:'inactivo'};
  const carrito=abrirCarrito(s,idMesa,idMesero);
  const existente=carrito.items.find(it=>it.idProducto===idProducto && !it.observacion);
  if(existente) existente.cantidad+=1;
  else carrito.items.push({idProducto,nombre:producto.nombre,cantidad:1,precioUnitario:producto.precio,observacion:''});
  return {ok:true};
}
function cambiarCantidadCarrito(s,idMesa,index,delta){
  const carrito=s.carritos[idMesa]; if(!carrito||!carrito.items[index]) return;
  carrito.items[index].cantidad+=delta;
  if(carrito.items[index].cantidad<=0) carrito.items.splice(index,1);
}
function eliminarItemCarrito(s,idMesa,index){
  const carrito=s.carritos[idMesa]; if(!carrito) return;
  carrito.items.splice(index,1);
}
function setObservacionCarrito(s,idMesa,index,texto){
  const carrito=s.carritos[idMesa]; if(!carrito||!carrito.items[index]) return;
  carrito.items[index].observacion=texto;
}
// A partir de aquí, cada acción que cambia datos compartidos escribe
// directamente en Supabase (en vez de mutar "s" en memoria) y el cambio
// le llega a TODOS los dispositivos conectados vía tiempo real, que
// dispara syncFromSupabase() + render() solo. Devuelven la misma forma
// de resultado {ok, motivo, ...} que antes para no tener que tocar el
// despachador de acciones más de lo necesario.
async function enviarPedido(s,idMesa,idMesero){
  const carrito=s.carritos[idMesa];
  if(!carrito||carrito.items.length===0) return {ok:false,motivo:'carrito_vacio'};
  const mesa=getMesa(s,idMesa);
  let idPedido=mesa.idPedidoActivo;
  let numeroRonda=1;
  if(idPedido){
    const pedido=getPedido(s,idPedido);
    numeroRonda=pedido.rondas.length+1;
  } else {
    const {data,error}=await sb.from('pedidos').insert({restaurante_id:RESTAURANTE_ID, mesa_id:idMesa, mesero_principal_id:idMesero}).select().single();
    if(error) return {ok:false,motivo:'error_db',error};
    idPedido=data.id;
    const {error:errMesa}=await sb.from('mesas').update({pedido_activo_id:idPedido}).eq('id',idMesa);
    if(errMesa) return {ok:false,motivo:'error_db',error:errMesa};
  }
  const now=Date.now();
  const idRonda=idPedido+'-R'+numeroRonda;
  const {error:errRonda}=await sb.from('rondas').insert({
    id:idRonda, pedido_id:idPedido, numero:numeroRonda, mesero_id:idMesero,
    items:carrito.items.map(it=>Object.assign({},it)), estado:'nuevo',
    historial:[{de:null,a:'nuevo',usuario:idMesero,hora:now}],
  });
  if(errRonda) return {ok:false,motivo:'error_db',error:errRonda};
  s.carritos[idMesa]={idMesero,items:[]};
  return {ok:true,idPedido,idRonda};
}
const ORDEN_ESTADOS_RONDA=['nuevo','aceptado','preparando','listo','entregado'];
function siguienteEstadoRonda(estado){
  const idx=ORDEN_ESTADOS_RONDA.indexOf(estado);
  if(idx===-1||idx===ORDEN_ESTADOS_RONDA.length-1) return null;
  return ORDEN_ESTADOS_RONDA[idx+1];
}
async function cambiarEstadoRonda(s,idPedido,idRonda,nuevo,usuario){
  const pedido=getPedido(s,idPedido); if(!pedido) return {ok:false,motivo:'pedido_no_existe'};
  const ronda=pedido.rondas.find(r=>r.id===idRonda); if(!ronda) return {ok:false,motivo:'ronda_no_existe'};
  const historial=(ronda.historial||[]).concat([{de:ronda.estado,a:nuevo,usuario,hora:Date.now()}]);
  const {error}=await sb.from('rondas').update({estado:nuevo, historial}).eq('id',idRonda);
  return error ? {ok:false,motivo:'error_db',error} : {ok:true};
}
async function anularRonda(s,idPedido,idRonda,motivo,usuario){
  const pedido=getPedido(s,idPedido); if(!pedido) return {ok:false,motivo:'pedido_no_existe'};
  const ronda=pedido.rondas.find(r=>r.id===idRonda); if(!ronda) return {ok:false,motivo:'ronda_no_existe'};
  if(['nuevo','aceptado'].indexOf(ronda.estado)===-1) return {ok:false,motivo:'estado_no_anulable'};
  const historial=(ronda.historial||[]).concat([{de:ronda.estado,a:'anulado',usuario,hora:Date.now(),motivo}]);
  const {error}=await sb.from('rondas').update({estado:'anulado', motivo_anulacion:motivo, historial}).eq('id',idRonda);
  return error ? {ok:false,motivo:'error_db',error} : {ok:true};
}
async function pedirCuenta(s,idPedido){
  const {error}=await sb.from('pedidos').update({estado_cuenta:'cuenta_solicitada', cuenta_solicitada_en:new Date().toISOString()}).eq('id',idPedido);
  return error ? {ok:false,motivo:'error_db',error} : {ok:true};
}
async function aplicarServicioDescuento(s,idPedido,opts){
  const patch={};
  if(typeof opts.servicioAplicado==='boolean') patch.servicio_aplicado=opts.servicioAplicado;

  try{
    const uRaw=localStorage.getItem('latinsoft_pedidos_ui_v1');
    if(uRaw){
      const uParsed=JSON.parse(uRaw);
      ui.vista=uParsed.vista||'mesero';

      ui.admin.pantalla=(uParsed.admin&&uParsed.admin.pantalla)||'dashboard';

   ============================================================ */
let audioCtx=null;
function beep(freqs){
  try{
    if(!audioCtx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      audioCtx=new AC();
    }
    if(audioCtx.state==='suspended') audioCtx.resume();
    let t=audioCtx.currentTime;
    freqs.forEach(function(f,i){
      const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
      o.type='sine'; o.frequency.value=f;
      o.connect(g); g.connect(audioCtx.destination);
      const start=t+i*0.11;
      g.gain.setValueAtTime(0.0001,start);
      g.gain.exponentialRampToValueAtTime(0.14,start+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,start+0.16);
      o.start(start); o.stop(start+0.18);
    });
  }catch(e){ /* audio no disponible en este entorno */ }
}
function vibrar(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }

function pushToast(titulo,cuerpo){
  toastSeq++;
  const id=toastSeq;
  toasts.push({id,titulo,cuerpo});
  renderToasts();
  setTimeout(function(){
    toasts=toasts.filter(function(t){return t.id!==id;});
    renderToasts();
  },4200);
}

function money(n){ return '$' + Math.round(n).toLocaleString('es-CO'); }
function horaCorta(ts){
  const d=new Date(ts);
  let h=d.getHours(); const m=d.getMinutes(); const ampm=h>=12?'p. m.':'a. m.';
  h=h%12; if(h===0) h=12;
  return h+':'+String(m).padStart(2,'0')+' '+ampm;
}
function fechaHoy(){
  const d=new Date();
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const dias=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  return dias[d.getDay()]+', '+d.getDate()+' de '+meses[d.getMonth()]+' de '+d.getFullYear();
}
function minutosDesde(ts){ return Math.max(0, Math.floor((Date.now()-ts)/60000)); }
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ---------- ciclo de vida de la cámara ---------- */
let camaraStream=null, camaraIniciando=false, deteccionActiva=false, zxingControls=null, torchActivo=false;
let ultimoCodigoLeido=null, ultimoCodigoLeidoEn=0;

function detenerCamara(){
  deteccionActiva=false;
  torchActivo=false;
  if(zxingControls){ try{ zxingControls.stop(); }catch(e){} zxingControls=null; }
  if(camaraStream){ try{ camaraStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} camaraStream=null; }
}

async function iniciarCamara(){
  if(camaraIniciando) return;
  camaraIniciando=true;
  ocultarAvisoScanner();
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      mostrarAvisoScanner('Este navegador no permite usar la cámara aquí. Usa el código manual o toca el producto en la lista.');
      camaraIniciando=false; return;
    }
    camaraStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false });
    const video=document.getElementById('scanner-video');
    if(!video){ detenerCamara(); camaraIniciando=false; return; } // el usuario cerró el escáner justo mientras cargaba
    video.srcObject=camaraStream;
    try{ await video.play(); }catch(e){}
    configurarLinterna();
    if(window.BarcodeDetector){ iniciarDeteccionNativa(); }
    else if(window.ZXing){ iniciarDeteccionZXing(); }
    else { mostrarAvisoScanner('Tu navegador no trae lector de códigos. Usa el código manual o toca el producto en la lista.'); }
  }catch(err){
    mostrarAvisoScanner('No se pudo usar la cámara (¿diste permiso?). Usa el código manual o toca el producto en la lista.');
  }
  camaraIniciando=false;
}

function configurarLinterna(){
  const btn=document.getElementById('scanner-torch-btn');
  if(!btn || !camaraStream) return;
  const track=camaraStream.getVideoTracks()[0];
  if(!track || typeof track.getCapabilities!=='function') return;
  let caps={};
  try{ caps=track.getCapabilities(); }catch(e){ return; }
  if(caps && caps.torch) btn.style.display='flex';
}

async function alternarLinterna(){
  if(!camaraStream) return;
  const track=camaraStream.getVideoTracks()[0];
  if(!track) return;
  try{
    torchActivo=!torchActivo;
    await track.applyConstraints({ advanced:[{ torch:torchActivo }] });
    const btn=document.getElementById('scanner-torch-btn');
    if(btn) btn.classList.toggle('on', torchActivo);
  }catch(e){ torchActivo=!torchActivo; /* no se pudo, revertimos el estado */ }
}

function iniciarDeteccionNativa(){
  deteccionActiva=true;
  const detector=new window.BarcodeDetector({ formats:['code_128'] });
  async function loop(){
    if(!deteccionActiva) return;
    const video=document.getElementById('scanner-video');
    if(video && video.readyState>=2){
      try{
        const codigos=await detector.detect(video);
        if(codigos && codigos.length>0) manejarCodigoLeido(codigos[0].rawValue);
      }catch(e){}
    }
    if(deteccionActiva) requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

function iniciarDeteccionZXing(){
  deteccionActiva=true;
  try{
    const hints=new Map();
    hints.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS, [window.ZXing.BarcodeFormat.CODE_128]);
    const reader=new window.ZXing.BrowserMultiFormatReader(hints);
    reader.decodeFromVideoDevice(null, 'scanner-video', function(result){
      if(result) manejarCodigoLeido(result.getText());
    }).then(function(controls){ zxingControls=controls; }).catch(function(){
      mostrarAvisoScanner('No se pudo iniciar el lector de códigos.');
    });
  }catch(e){
    mostrarAvisoScanner('No se pudo iniciar el lector de códigos.');
  }
}

function manejarCodigoLeido(codigo){
  if(!codigo || !scannerDebeMostrarse()) return;
  const ahora=Date.now();
  // el mismo código leído dos veces en menos de 1.5s se ignora (evita dobles lecturas)
  if(codigo===ultimoCodigoLeido && (ahora-ultimoCodigoLeidoEn)<1500) return;
  ultimoCodigoLeido=codigo; ultimoCodigoLeidoEn=ahora;

  const m=ui.mesero;
  const producto=state.productos.find(function(p){ return p.codigo===codigo; });
  if(!producto){ vibrar(80); pushToast('❌ Producto no encontrado','Código: '+codigo); return; }
  const r=agregarProductoAlCarrito(state, m.mesaActiva, m.logueado, producto.id);
  if(r.ok){
    vibrar(30);
    flashScannerVisual();
    actualizarContadorScanner();
    pushToast('✅ Agregado', producto.nombre+' · '+money(producto.precio));
    guardar();
  } else if(r.motivo==='inactivo'){
    pushToast('⚠️ No disponible','Este producto está inactivo en este momento.');
  }
}

/* ---------- mostrar/ocultar el escáner (vive fuera de renderMesero) ---------- */
function sincronizarScanner(){
  const el=document.getElementById('scanner-persistente');
  if(!el) return;
  const debeMostrar=scannerDebeMostrarse();
  const estaMostrado=!el.classList.contains('hidden');
  if(debeMostrar && !estaMostrado){
    el.classList.remove('hidden');
    el.innerHTML=contenidoScannerHTML();
    iniciarCamara();
  } else if(!debeMostrar && estaMostrado){
    detenerCamara();
    el.classList.add('hidden');
    el.innerHTML='';
  }
  // si ya estaba mostrado y sigue mostrado, no tocamos el innerHTML: ahí vive la cámara activa.
}

      stat(ocupadas+' / '+state.mesas.length,'Mesas ocupadas')+
      stat(String(nuevos),'Pedidos nuevos')+
      stat(String(enPrep),'En preparación')+
      stat(String(listos),'Listos')+
      stat(money(ventasHoy),'Ventas del día')+
    '</div>'
  );
  function stat(v,l){ return '<div class="stat-card"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>'; }
}

function todasLasRondasAbiertas(){
  const out=[];
  Object.keys(state.pedidos).forEach(function(id){
    const p=state.pedidos[id];
    p.rondas.forEach(function(r){
      if(r.estado!=='anulado') out.push({pedido:p,ronda:r});
    });
  });
  out.sort(function(a,b){return a.ronda.enviadoEn-b.ronda.enviadoEn;});
  return out;
}

  const cols=[

    {key:'aceptado_preparando', label:'Aceptado / Preparando', match:function(e){return e.ronda.estado==='aceptado'||e.ronda.estado==='preparando';}},
    {key:'listo', label:'Listo', match:function(e){return e.ronda.estado==='listo';}},

  const filtroChips = ['todos'].concat(state.meseros.map(function(m){return m.id;})).map(function(id){

function kanbanCard(e){
  const p=e.pedido, r=e.ronda;
  const mesa=getMesa(state,p.idMesa);
  const mesero=getMesero(state,r.idMesero);
  const min=minutosDesde(r.enviadoEn);
  const urgente = min>=20 && r.estado!=='entregado';
  const sig=siguienteEstadoRonda(r.estado);
  const items = r.items.map(function(it){
    return '<div class="kitem">'+it.cantidad+' × '+esc(it.nombre)+(it.observacion?' <span class="obs">('+esc(it.observacion)+')</span>':'')+'</div>';
  }).join('');
  const mostrarFacturar = r.estado==='entregado' && p.estadoCuenta==='cuenta_solicitada' && esUltimaRondaDeLaMesa(p, r);
  return (
    '<div class="kcard'+(urgente?' urgente':'')+'">'+
      '<div class="kh"><span>'+p.id+' · R'+r.numero+'</span><span class="tiempo">'+min+' min</span></div>'+
      '<div class="mesa-lbl">Mesa '+mesa.numero+'</div>'+
      '<div class="mes-lbl">Mesero: '+esc(mesero.nombre)+' · '+horaCorta(r.enviadoEn)+'</div>'+
      items+
      '<div class="kfoot">'+
        (sig?('<button class="btn btn-ember btn-sm" data-action="ronda-avanzar" data-arg="'+p.id+','+r.id+'">'+ETIQUETA_ESTADO[sig]+'</button>'):'')+
        '<button class="btn btn-ghost btn-sm" data-action="ronda-detalle-abrir" data-arg="'+p.id+','+r.id+'">Detalle</button>'+
      '</div>'+
      (mostrarFacturar?'<span class="cuenta-flag">💳 Pidió la cuenta</span><button class="btn btn-gold btn-sm btn-block" style="margin-top:6px" data-action="ir-facturar" data-arg="'+mesa.id+'">Facturar</button>':'')+
    '</div>'
  );
}
function esUltimaRondaDeLaMesa(pedido,ronda){
  const vivas=pedido.rondas.filter(function(r){return r.estado!=='anulado';});
  return vivas[vivas.length-1].id===ronda.id;
}

function mesasFacturables(){
  return state.mesas.filter(function(m){
    if(!m.idPedidoActivo) return false;
    const p=getPedido(state,m.idPedidoActivo);
    return p.estadoCuenta!=='pagado';
  });
}

function adminFacturacion(){
  const a=ui.admin;
  const candidatas=mesasFacturables();
  const selector = candidatas.map(function(m){
    return '<button class="chip-filtro'+(a.facturaMesa===m.id?' active':'')+'" data-action="facturacion-seleccionar-mesa" data-arg="'+m.id+'">Mesa '+m.numero+'</button>';
  }).join('');

  if(!a.facturaMesa || candidatas.every(function(m){return m.id!==a.facturaMesa;})){
    if(candidatas.length>0) a.facturaMesa=candidatas[0].id; else a.facturaMesa=null;
  }

  if(!a.facturaMesa){
    return (
      '<div class="admin-topline"><h2>Facturación</h2><div class="mut">Cobro y cierre de cuentas</div></div>'+
      '<div class="empty-state"><div class="big">💳</div>No hay mesas pendientes de facturar en este momento.</div>'
    );
  }

  const mesa=getMesa(state,a.facturaMesa);
  const pedido=getPedido(state,mesa.idPedidoActivo);
  const tot=totalesPedido(pedido);
  const pagado=totalPagado(pedido);
  const faltante=Math.max(0,tot.total-pagado);

  const rondasHtml = pedido.rondas.filter(function(r){return r.estado!=='anulado';}).map(function(r){
    const items=r.items.map(function(it){
      return '<div class="line-item"><span>'+it.cantidad+' × '+esc(it.nombre)+'</span><span>'+money(totalItem(it))+'</span></div>';
    }).join('');
    return '<div style="margin-bottom:10px;"><div style="font-size:11.5px; font-weight:700; color:var(--ink-500); margin-bottom:3px;">RONDA '+r.numero+' · '+esc(getMesero(state,r.idMesero).nombre)+'</div>'+items+'</div>';
  }).join('');

  const formas=[['efectivo','💵 Efectivo'],['tarjeta','💳 Tarjeta'],['transferencia','📱 Transferencia'],['mixto','➗ Mixto']];
  const payOpts = formas.map(function(f){
    return '<button class="pay-opt'+(a.pagoFormaSel===f[0]?' active':'')+'" data-action="facturacion-forma-pago" data-arg="'+f[0]+'">'+f[1]+'</button>';
  }).join('');

  let pagoExtra='';
  if(a.pagoFormaSel==='efectivo'){
    pagoExtra = '<div class="form-row"><label>Recibido en efectivo</label><input type="number" id="recibido-input" min="0" step="1000" placeholder="'+tot.total+'" oninput="window.__actualizarCambio()"></div><div id="cambio-calc" class="mut"></div>';
  } else if(a.pagoFormaSel==='mixto'){
    const pagosRows = pedido.pagos.map(function(p,idx){
      return '<div class="mix-pago-row"><span>'+({efectivo:'Efectivo',tarjeta:'Tarjeta',transferencia:'Transferencia'}[p.formaPago]||p.formaPago)+'</span><span>'+money(p.valor)+' <button class="icon-btn" data-action="facturacion-quitar-pago" data-arg="'+p.id+'">✕</button></span></div>';
    }).join('');
    pagoExtra = (
      '<div class="form-row">'+pagosRows+'</div>'+
      '<div class="form-row" style="display:flex; gap:8px; align-items:flex-end;">'+
        '<div style="flex:1"><label>Forma</label><select id="mixto-forma-input"><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta</option><option value="transferencia">Transferencia</option></select></div>'+
        '<div style="flex:1"><label>Monto</label><input type="number" id="mixto-monto-input" min="0" step="1000" placeholder="'+faltante+'"></div>'+
        '<button class="btn btn-ghost btn-sm" data-action="facturacion-agregar-pago">Agregar</button>'+
      '</div>'+
      '<div class="mut">Falta por cubrir: <b>'+money(faltante)+'</b></div>'
    );
  } else if(a.pagoFormaSel==='tarjeta' || a.pagoFormaSel==='transferencia'){
    pagoExtra = '<p class="mut">Se registrará un pago único de '+money(tot.total)+'.</p>';
  }

  const puedeCobrar = a.pagoFormaSel==='tarjeta' || a.pagoFormaSel==='transferencia' || (a.pagoFormaSel==='efectivo') || (a.pagoFormaSel==='mixto' && pagado>=tot.total && tot.total>0);

  return (
    '<div class="admin-topline"><h2>Facturación</h2><div class="mut">Cobro y cierre de cuentas</div></div>'+
    '<div class="filtro-row">'+selector+'</div>'+
    '<div style="display:grid; grid-template-columns:1.1fr .9fr; gap:22px; align-items:start;">'+
      '<div><h4 style="margin:4px 0 10px;">Detalle del pedido — '+pedido.id+'</h4>'+rondasHtml+
        '<div class="form-row" style="display:flex; align-items:center; gap:10px; margin-top:14px;">'+
          '<input type="checkbox" id="servicio-toggle" '+(pedido.servicioAplicado?'checked':'')+' data-action="facturacion-toggle-servicio" style="width:auto"> '+
          '<label style="margin:0" for="servicio-toggle">Servicio voluntario ('+pedido.servicioPct+'%)</label>'+
        '</div>'+
        '<div class="form-row"><label>Descuento (COP)</label><input type="number" id="descuento-input" min="0" step="1000" value="'+pedido.descuento+'" onchange="window.__aplicarDescuento(this.value)"></div>'+
      '</div>'+
      '<div>'+
        '<div class="total-line"><span>Subtotal</span><span>'+money(tot.subtotal)+'</span></div>'+
        '<div class="total-line"><span>Servicio</span><span>'+money(tot.servicio)+'</span></div>'+
        '<div class="total-line"><span>Descuento</span><span>-'+money(tot.descuento)+'</span></div>'+
        '<div class="total-line grand"><span>Total</span><span>'+money(tot.total)+'</span></div>'+
        (pagado>0?'<div class="total-line"><span>Pagado</span><span>'+money(pagado)+'</span></div>':'')+
        '<div class="pay-opts" style="margin-top:14px;">'+payOpts+'</div>'+
        pagoExtra+
        '<button class="btn btn-ember btn-block" style="margin-top:14px" data-action="facturacion-cobrar" '+(puedeCobrar?'':'disabled')+'>Cobrar e imprimir</button>'+
      '</div>'+
    '</div>'
  );
}

/* ---------- Ventas del día ---------- */
function adminVentas(){
  const pagados = Object.keys(state.pedidos).map(function(id){return state.pedidos[id];}).filter(function(p){return p.estadoCuenta==='pagado';});
  const totalVendido = pagados.reduce(function(a,p){return a+totalesPedido(p).total;},0);
  const nPedidos = pagados.length;
  const ticket = nPedidos? totalVendido/nPedidos : 0;

  const porMesero={};
  const porForma={};
  const porProducto={};
  pagados.forEach(function(p){
    const mesero=getMesero(state,p.meseroPrincipal);
    porMesero[mesero.nombre]=(porMesero[mesero.nombre]||0)+totalesPedido(p).total;
    p.pagos.forEach(function(pg){ porForma[pg.formaPago]=(porForma[pg.formaPago]||0)+pg.valor; });
    p.rondas.filter(function(r){return r.estado!=='anulado';}).forEach(function(r){
      r.items.forEach(function(it){ porProducto[it.nombre]=(porProducto[it.nombre]||0)+it.cantidad; });
    });
  });
  const topProductos = Object.keys(porProducto).map(function(n){return {nombre:n,cant:porProducto[n]};}).sort(function(a,b){return b.cant-a.cant;}).slice(0,10);

  function filaMesero(nombre,v){ return '<div class="total-line"><span>'+esc(nombre)+'</span><span>'+money(v)+'</span></div>'; }
  const FORMA_LABEL={efectivo:'Efectivo',tarjeta:'Tarjeta',transferencia:'Transferencia'};

  if(nPedidos===0){
    return (
      '<div class="admin-topline"><h2>Ventas del día</h2><div class="mut">'+fechaHoy()+'</div></div>'+
      '<div class="empty-state"><div class="big">📈</div>Aún no se ha cobrado ningún pedido hoy.</div>'
    );
  }

  return (
    '<div class="admin-topline"><div><h2>Ventas del día</h2><div class="mut">'+fechaHoy()+'</div></div>'+
      '<div style="display:flex; gap:8px;"><button class="btn btn-ghost btn-sm" data-action="ventas-exportar-csv">⬇ Exportar CSV</button><button class="btn btn-ghost btn-sm" data-action="ventas-imprimir-resumen">🖨️ Imprimir resumen</button></div></div>'+
    '<div class="stat-row" style="grid-template-columns:repeat(3,1fr); max-width:620px; margin-bottom:24px;">'+
      '<div class="stat-card"><div class="v">'+money(totalVendido)+'</div><div class="l">Total vendido</div></div>'+
      '<div class="stat-card"><div class="v">'+nPedidos+'</div><div class="l">Pedidos cobrados</div></div>'+
      '<div class="stat-card"><div class="v">'+money(ticket)+'</div><div class="l">Ticket promedio</div></div>'+
    '</div>'+
    '<div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:24px;">'+
      '<div><h4 style="margin:0 0 8px;">Por mesero</h4>'+Object.keys(porMesero).map(function(n){return filaMesero(n,porMesero[n]);}).join('')+'</div>'+
      '<div><h4 style="margin:0 0 8px;">Por forma de pago</h4>'+Object.keys(porForma).map(function(f){return filaMesero(FORMA_LABEL[f]||f,porForma[f]);}).join('')+'</div>'+
      '<div><h4 style="margin:0 0 8px;">Top productos</h4>'+topProductos.map(function(t){return '<div class="total-line"><span>'+esc(t.nombre)+'</span><span>'+t.cant+'</span></div>';}).join('')+'</div>'+
    '</div>'
  );
}

/* ---------- Comprobante ---------- */
function construirComprobanteHtml(pedido){
  const mesa=getMesa(state,pedido.idMesa);
  const mesero=getMesero(state,pedido.meseroPrincipal);
  const tot=totalesPedido(pedido);
  const r=state.restaurante;
  let lineas='';
  pedido.rondas.filter(function(rr){return rr.estado!=='anulado';}).forEach(function(ronda){
    ronda.items.forEach(function(it){
      lineas += '<div class="cp-row"><span>'+it.cantidad+'x '+esc(it.nombre)+'</span><span>'+money(totalItem(it))+'</span></div>';
    });
  });
  const pagosTxt = pedido.pagos.map(function(p){ return ({efectivo:'Efectivo',tarjeta:'Tarjeta',transferencia:'Transferencia'}[p.formaPago]||p.formaPago)+': '+money(p.valor); }).join(' · ');
  const efectivoPago = pedido.pagos.find(function(p){return p.formaPago==='efectivo';});
  const cambio = efectivoPago && efectivoPago.recibido ? Math.max(0, efectivoPago.recibido - tot.total + (tot.total - totalPagado(pedido)===0 ? 0:0)) : null;
  return (
    '<div class="comprobante-paper">'+
      '<div class="cp-center"><b>'+esc(r.nombre)+'</b><br>NIT '+esc(r.nit)+'<br>'+esc(r.direccion)+'</div>'+
      '<hr>'+
      '<div class="cp-row"><span>'+pedido.id+'</span><span>'+horaCorta(pedido.pagadoEn||Date.now())+'</span></div>'+
      '<div class="cp-row"><span>Mesa '+mesa.numero+'</span><span>'+esc(mesero.nombre)+'</span></div>'+
      '<hr>'+
      lineas+
      '<hr>'+
      '<div class="cp-row"><span>Subtotal</span><span>'+money(tot.subtotal)+'</span></div>'+
      '<div class="cp-row"><span>Servicio</span><span>'+money(tot.servicio)+'</span></div>'+
      '<div class="cp-row"><span>Descuento</span><span>-'+money(tot.descuento)+'</span></div>'+
      '<div class="cp-row"><b>TOTAL</b><b>'+money(tot.total)+'</b></div>'+
      '<hr>'+
      '<div class="cp-row"><span>Pago</span><span>'+esc(pagosTxt)+'</span></div>'+
      (cambio!=null?'<div class="cp-row"><span>Cambio</span><span>'+money(cambio)+'</span></div>':'')+
      '<hr><div class="cp-center">'+esc(r.pieComprobante)+'</div>'+
    '</div>'
  );
}

function loginUsuarioActual(){ return ui.mesero.usuarioSel; }

async function intentarLogin(){
  const m=ui.mesero;
  const usr=getMesero(state,m.usuarioSel);
  if(!usr){ m.loginError='Selecciona tu usuario.'; return; }
  if(usr.estado!=='activo'){ m.loginError='Usuario desactivado. Contacta a administración.'; return; }
  if(m.pinInput.length<4) return;
  if(usr.pin!==m.pinInput){
    m.loginError='PIN incorrecto. Intenta de nuevo.';
    m.pinInput='';
    return;
  }
  m.logueado=usr.id;
  m.pantalla='mesas';
  m.pinInput='';
  m.loginError=null;
  m.turnoInicio=Date.now();
  pushToast('👋 Bienvenido', usr.nombre+' inició sesión.');
  marcarUltimoIngreso(usr.id); // no bloquea el login si tarda o falla
}

async function intentarLoginAdmin(){
  const a=ui.admin;
  const usr=getMesero(state,a.usuarioSel);
  if(!usr){ a.loginError='Selecciona tu usuario.'; return; }
  if(usr.estado!=='activo'){ a.loginError='Usuario desactivado.'; return; }

  a.pinInput='';
  a.loginError=null;
  pushToast('👋 Bienvenido', usr.nombre+' inició sesión.');

}

async function manejarAccion(actionEl){
  const action=actionEl.getAttribute('data-action');
  const arg=actionEl.getAttribute('data-arg');
  const m=ui.mesero, a=ui.admin;
  let necesitaResync=false; // las acciones que escriben en Supabase lo marcan en true

  switch(action){
    /* ---- globales ---- */
    case 'switch-vista': ui.vista=arg; break;
    case 'actualizar-todo': await actualizarTodo(); return;

    /* ---- login ---- */
    case 'login-usuario-select': m.usuarioSel=arg; m.loginError=null; break;
    case 'login-pin-digit':
      if(m.pinInput.length<4) m.pinInput+=arg;
      if(m.pinInput.length===4) await intentarLogin();
      break;
    case 'login-pin-borrar': m.pinInput=m.pinInput.slice(0,-1); m.loginError=null; break;

    /* ---- login admin ---- */
    case 'admin-login-usuario-select': a.usuarioSel=arg; a.loginError=null; break;
    case 'admin-login-pin-digit':
      if(a.pinInput.length<4) a.pinInput+=arg;
      if(a.pinInput.length===4) await intentarLoginAdmin();
      break;
    case 'admin-login-pin-borrar': a.pinInput=a.pinInput.slice(0,-1); a.loginError=null; break;
    case 'admin-logout': a.logueado=null; a.usuarioSel=null; a.pantalla='dashboard'; break;

    /* ---- navegación mesero ---- */
    case 'mesero-tab':
      if(arg==='escanear'){
        if(!m.mesaActiva){ pushToast('Selecciona una mesa','Primero toca una mesa para empezar a escanear.'); m.pantalla='mesas'; }
        else { m.pantalla='pedido'; m.scannerAbierto=true; }
      } else { m.pantalla=arg; }
      break;
    case 'mesero-logout': m.logueado=null; m.pantalla='mesas'; m.mesaActiva=null; break;
    case 'mesa-tap': m.mesaActiva=arg; m.pantalla='pedido'; break;
    case 'volver-mesas': m.pantalla='mesas'; m.mesaActiva=null; break;

    /* ---- escáner ---- */
    case 'abrir-scanner': m.scannerAbierto=true; break;
    case 'cerrar-scanner': m.scannerAbierto=false; break;
    case 'scanner-toggle-torch': alternarLinterna(); return; // no toca el resto del render
    case 'scan-producto': {
      // Toque manual sobre la lista (respaldo si la cámara no lee o no hay permiso).
      // No usa manejarCodigoLeido() porque aquí ya sabemos el producto exacto (por
      // id, no por código leído) y no aplica el debounce de 1.5s de la cámara.
      const r=agregarProductoAlCarrito(state,m.mesaActiva,m.logueado,arg);
      if(r.ok){
        const prod=getProducto(state,arg);
        vibrar(30);
        flashScannerVisual();
        actualizarContadorScanner();
        pushToast('✅ Agregado', prod.nombre+' · '+money(prod.precio));
      } else if(r.motivo==='inactivo'){
        pushToast('⚠️ No disponible','Este producto está inactivo en este momento.');
      } else {
        pushToast('❌ Producto no encontrado','Verifica el código e intenta de nuevo.');
      }
      guardar(); // el carrito cambió aunque no re-renderizamos todo
      return;
    }
    case 'scan-manual-submit': {
      const input=document.getElementById('scan-manual-input');
      const codigo=input?input.value.trim():'';
      if(!codigo) return;
      const prod=state.productos.find(function(p){return p.codigo===codigo;});
      if(!prod){ pushToast('❌ Producto no encontrado','No existe un producto con ese código.'); return; }
      const r=agregarProductoAlCarrito(state,m.mesaActiva,m.logueado,prod.id);
      if(r.ok){ vibrar(30); flashScannerVisual(); actualizarContadorScanner(); pushToast('✅ Agregado', prod.nombre+' · '+money(prod.precio)); if(input) input.value=''; guardar(); }
      else if(r.motivo==='inactivo'){ pushToast('⚠️ No disponible','Este producto está inactivo en este momento.'); }
      return;
    }

    /* ---- carrito ---- */
    case 'carrito-qty': {
      const parts=arg.split(','); cambiarCantidadCarrito(state,m.mesaActiva,parseInt(parts[0],10),parseInt(parts[1],10)); break;
    }
    case 'carrito-eliminar': eliminarItemCarrito(state,m.mesaActiva,parseInt(arg,10)); break;
    case 'carrito-obs-abrir': m.obsEditIndex=parseInt(arg,10); break;
    case 'carrito-obs-cerrar': m.obsEditIndex=null; break;
    case 'carrito-obs-chip': {
      const parts=arg.split('|'); const idx=parseInt(parts[0],10); const chip=parts[1];
      const carrito=state.carritos[m.mesaActiva]; const item=carrito.items[idx];
      let actual=(item.observacion||'').split(', ').filter(Boolean);
      if(actual.indexOf(chip)>-1) actual=actual.filter(function(c){return c!==chip;});
      else actual.push(chip);
      item.observacion=actual.join(', ');
      break;
    }
    case 'carrito-obs-guardar': {
      const idx=parseInt(arg,10);
      const ta=document.getElementById('obs-texto-input');
      const carrito=state.carritos[m.mesaActiva]; const item=carrito.items[idx];
      const chipsTxt=(item.observacion||'').split(', ').filter(function(c){return ['sin cebolla','término medio','sin hielo','para llevar','picante','sin sal'].indexOf(c)>-1;});
      const libre = ta?ta.value.trim():'';
      const combinado = chipsTxt.concat(libre?[libre]:[]).join(', ');
      setObservacionCarrito(state,m.mesaActiva,idx,combinado);
      m.obsEditIndex=null;
      break;
    }

    /* ---- enviar pedido ---- */
    case 'enviar-pedido-confirmar-abrir': m.__confirmEnvio=true; break;
    case 'enviar-pedido-confirmar-no': m.__confirmEnvio=false; break;
    case 'enviar-pedido-confirmar-si': {
      m.__confirmEnvio=false;
      const carritoPrev = state.carritos[m.mesaActiva];
      const totalRonda = carritoPrev.items.reduce(function(a,it){return a+totalItem(it);},0);
      const mesaNum = getMesa(state,m.mesaActiva).numero;
      const r = await enviarPedido(state,m.mesaActiva,m.logueado);
      if(r.ok){
        necesitaResync=true;
        m.confirmando=true;
        m.confirmInfo={idPedido:r.idPedido, mesaNum:mesaNum, hora:Date.now(), total:totalRonda};
        beep([660,880]);
        pushToast('🔔 Pedido enviado', r.idPedido+' · Mesa '+mesaNum);
      } else {
        pushToast('⚠️ No se pudo enviar','Revisa tu conexión e intenta de nuevo.');
      }
      break;
    }
    case 'confirmacion-volver-mesas': m.confirmando=false; m.confirmInfo=null; m.pantalla='mesas'; m.mesaActiva=null; break;
    case 'confirmacion-nuevo-pedido': m.confirmando=false; m.confirmInfo=null; m.pantalla='pedido'; break;
    case 'pedir-cuenta': {
      const mesa=getMesa(state,m.mesaActiva);
      const r = await pedirCuenta(state,mesa.idPedidoActivo);
      if(r.ok){ necesitaResync=true; pushToast('💳 Cuenta solicitada','Administración fue notificada.'); }
      else pushToast('⚠️ No se pudo avisar','Revisa tu conexión e intenta de nuevo.');
      break;
    }

    /* ---- mis pedidos ---- */
    case 'mispedidos-detalle-abrir': { const p=arg.split(','); m.detalleMiPedido={idPedido:p[0], idRonda:p[1]}; break; }
    case 'mispedidos-detalle-cerrar': m.detalleMiPedido=null; break;
    case 'marcar-entregado': {
      const p=arg.split(',');
      const r = await cambiarEstadoRonda(state,p[0],p[1],'entregado',m.logueado);
      if(r.ok){ necesitaResync=true; pushToast('✅ Marcado como entregado',''); }
      else pushToast('⚠️ No se pudo actualizar','Revisa tu conexión e intenta de nuevo.');
      break;
    }

    /* ---- navegación admin ---- */
    case 'admin-nav': a.pantalla=arg; a.mesaInfo=null; break;
    case 'admin-filtro-mesero': a.filtroMesero=arg; break;

    case 'ronda-avanzar': {
      const p=arg.split(',');
      const pedido=getPedido(state,p[0]);
      const ronda=pedido.rondas.find(function(r){return r.id===p[1];});
      const sig=siguienteEstadoRonda(ronda.estado);
      if(sig){
        const r = await cambiarEstadoRonda(state,p[0],p[1],sig,a.logueado);
        if(r.ok){
          necesitaResync=true;
          if(sig==='listo'){
            const mesero=getMesero(state,ronda.idMesero);
            pushToast('🔔 Mesa lista', getMesa(state,pedido.idMesa).numero+' — avisa a '+mesero.nombre.split(' ')[0]+'.');
            vibrar([40,60,40]);
          }
        } else pushToast('⚠️ No se pudo actualizar','Revisa tu conexión e intenta de nuevo.');
      }
      break;
    }
    case 'ronda-detalle-abrir': { const p=arg.split(','); a.detalle={idPedido:p[0], idRonda:p[1]}; break; }
    case 'ronda-detalle-cerrar': a.detalle=null; break;
    case 'ronda-anular-abrir': { const p=arg.split(','); a.anularInfo={idPedido:p[0], idRonda:p[1]}; a.detalle=null; break; }
    case 'ronda-anular-cancelar': a.anularInfo=null; break;
    case 'ronda-anular-confirmar': {
      const motivoEl=document.getElementById('anular-motivo-input');
      const motivo=motivoEl&&motivoEl.value.trim()?motivoEl.value.trim():'Sin motivo especificado';
      const r = await anularRonda(state,a.anularInfo.idPedido,a.anularInfo.idRonda,motivo,a.logueado);
      a.anularInfo=null;
      if(r.ok){ necesitaResync=true; pushToast('🚫 Ronda anulada', motivo); }
      else pushToast('⚠️ No se pudo anular','Revisa tu conexión e intenta de nuevo.');
      break;
    }
    case 'comanda-imprimir': {
      const p=arg.split(','); const pedido=getPedido(state,p[0]); const ronda=pedido.rondas.find(function(r){return r.id===p[1];});
      const mesa=getMesa(state,pedido.idMesa); const mesero=getMesero(state,ronda.idMesero);
      const items=ronda.items.map(function(it){ return '<div class="cp-row"><span>'+it.cantidad+'x '+esc(it.nombre)+(it.observacion?' — '+esc(it.observacion):'')+'</span></div>'; }).join('');
      imprimir('<div class="comprobante-paper"><div class="cp-center"><b>COMANDA COCINA</b></div><hr><div class="cp-row"><span>'+pedido.id+' · R'+ronda.numero+'</span><span>'+horaCorta(ronda.enviadoEn)+'</span></div><div class="cp-row"><span>Mesa '+mesa.numero+'</span><span>'+esc(mesero.nombre)+'</span></div><hr>'+items+'</div>');
      break;
    }

    /* ---- mesas admin ---- */
    case 'admin-mesa-tap': a.mesaInfo=arg; break;
    case 'admin-mesa-cerrar-panel': a.mesaInfo=null; break;
    case 'ir-facturar': a.pantalla='facturacion'; a.facturaMesa=arg; a.mesaInfo=null; a.pagoFormaSel=null; break;

    /* ---- facturación ---- */
    case 'facturacion-seleccionar-mesa': a.facturaMesa=arg; a.pagoFormaSel=null; break;
    case 'facturacion-toggle-servicio': {
      const mesa=getMesa(state,a.facturaMesa);
      const pedido=getPedido(state,mesa.idPedidoActivo);
      const r = await aplicarServicioDescuento(state,pedido.id,{servicioAplicado:!pedido.servicioAplicado});
      if(r.ok) necesitaResync=true; else pushToast('⚠️ No se pudo guardar','Revisa tu conexión e intenta de nuevo.');
      break;
    }
    case 'facturacion-forma-pago': {
      a.pagoFormaSel=arg;
      const mesa=getMesa(state,a.facturaMesa);
      const pedido=getPedido(state,mesa.idPedidoActivo);
      await reiniciarPagosPedido(pedido.id); // reinicia los pagos al cambiar de forma (excepto mixto que se arma manualmente)
      const tot=totalesPedido(pedido);
      if(arg==='tarjeta'||arg==='transferencia'){
        await registrarPago(state,pedido.id,{formaPago:arg, valor:tot.total});
      }
      necesitaResync=true;
      break;
    }
    case 'facturacion-agregar-pago': {
      const mesa=getMesa(state,a.facturaMesa);
      const pedido=getPedido(state,mesa.idPedidoActivo);
      const formaEl=document.getElementById('mixto-forma-input');
      const montoEl=document.getElementById('mixto-monto-input');
      const monto=montoEl?parseFloat(montoEl.value):0;
      if(monto>0){
        const r = await registrarPago(state,pedido.id,{formaPago:formaEl?formaEl.value:'efectivo', valor:monto});
        if(r.ok) necesitaResync=true; else pushToast('⚠️ No se pudo registrar el pago','Revisa tu conexión e intenta de nuevo.');
      }
      break;
    }
    case 'facturacion-quitar-pago': {
      const r = await quitarPago(arg); // arg = id real de la fila de pago
      if(r.ok) necesitaResync=true; else pushToast('⚠️ No se pudo quitar el pago','Revisa tu conexión e intenta de nuevo.');
      break;
    }
    case 'facturacion-cobrar': {
      const mesa=getMesa(state,a.facturaMesa);
      const pedido=getPedido(state,mesa.idPedidoActivo);
      const tot=totalesPedido(pedido);
      if(a.pagoFormaSel==='efectivo'){
        const recEl=document.getElementById('recibido-input');
        const recibido = recEl&&parseFloat(recEl.value)>0 ? parseFloat(recEl.value) : tot.total;
        await reiniciarPagosPedido(pedido.id);
        await registrarPago(state,pedido.id,{formaPago:'efectivo', valor:tot.total, recibido:recibido});
      }
      const res = await cobrarPedido(state,pedido.id,a.logueado);
      if(res.ok){
        necesitaResync=true;
        pushToast('✅ Cobrado', pedido.id+' · '+money(tot.total));
        a.comprobante=pedido.id;
        a.facturaMesa=null; a.pagoFormaSel=null;
      } else if(res.motivo==='pago_insuficiente'){
        pushToast('⚠️ Pago insuficiente','Falta '+money(res.faltante||0)+' para completar el total.');
      } else {
        pushToast('⚠️ No se pudo cobrar','Revisa tu conexión e intenta de nuevo.');
      }
      break;
    }
    case 'comprobante-cerrar': a.comprobante=null; break;
    case 'comprobante-imprimir': {
      const pedido=getPedido(state,arg);
      imprimir(construirComprobanteHtml(pedido));
      break;
    }

    /* ---- productos ---- */
    case 'producto-crear-abrir': a.productoCrear=true; break;
    case 'producto-crear-cancelar': a.productoCrear=false; break;
    case 'producto-crear-guardar': {
      const nombre=(document.getElementById('prod-nombre-input')||{}).value||'';
      const cat=(document.getElementById('prod-cat-input')||{}).value||state.categorias[0].id;
      const precio=parseFloat((document.getElementById('prod-precio-input')||{}).value||'0');
      if(!nombre.trim() || !(precio>0)){ pushToast('⚠️ Datos incompletos','Ingresa nombre y precio válidos.'); break; }
      const r = await crearProducto({nombre:nombre.trim(), idCategoria:cat, precio:Math.round(precio)});
      a.productoCrear=false;
      if(r.ok){ necesitaResync=true; pushToast('✅ Producto creado', nombre.trim()+' · código '+r.codigo); }
      else pushToast('⚠️ No se pudo crear','Revisa tu conexión e intenta de nuevo.');
      break;
    }
    case 'producto-editar-precio': a.productoEditPrecio=arg; break;
    case 'producto-guardar-precio': {
      const input=document.getElementById('precio-edit-input');
      const val=input?parseFloat(input.value):NaN;
      if(val>0){
        const r = await actualizarPrecioProducto(arg, Math.round(val));
        if(r.ok){ necesitaResync=true; pushToast('✅ Precio actualizado','Aplica desde el próximo escaneo.'); }
        else pushToast('⚠️ No se pudo guardar','Revisa tu conexión e intenta de nuevo.');
      }
      a.productoEditPrecio=null;
      break;
    }
    case 'producto-toggle-estado': {
      const p=getProducto(state,arg);
      const r = await toggleEstadoProducto(arg, p.estado==='activo'?'inactivo':'activo');
      if(r.ok) necesitaResync=true; else pushToast('⚠️ No se pudo guardar','Revisa tu conexión e intenta de nuevo.');
      break;
    }
    case 'productos-imprimir-codigos': {
      const html='<div class="comprobante-paper" style="max-width:420px"><div class="cp-center"><b>Etiquetas de código — '+esc(state.restaurante.nombre)+'</b></div><hr>'+
        state.productos.map(function(p){ return '<div class="cp-row"><span>'+esc(p.nombre)+'</span><span>#'+p.codigo+' · '+money(p.precio)+'</span></div>'; }).join('')+
        '</div>';
      imprimir(html);
      break;
    }

    /* ---- meseros ---- */
    case 'mesero-crear-abrir': a.meseroCrear=true; break;
    case 'mesero-crear-cancelar': a.meseroCrear=false; break;
    case 'mesero-crear-guardar': {
      const nombre=(document.getElementById('mesero-nombre-input')||{}).value||'';
      const usuario=(document.getElementById('mesero-usuario-input')||{}).value||'';
      if(!nombre.trim()||!usuario.trim()){ pushToast('⚠️ Datos incompletos','Ingresa nombre y usuario.'); break; }
      const r = await crearMesero({nombre:nombre.trim(), usuario:usuario.trim().toLowerCase()});
      a.meseroCrear=false;
      if(r.ok){ necesitaResync=true; pushToast('✅ Mesero creado', 'PIN asignado: '+r.pin+' (guárdalo, no se mostrará de nuevo)'); }
      else pushToast('⚠️ No se pudo crear','Revisa que el usuario no esté repetido.');
      break;
    }
    case 'mesero-resetear-pin': {
      const mesero=getMesero(state,arg);
      const r = await resetearPinMesero(arg);
      if(r.ok){ necesitaResync=true; pushToast('🔑 PIN restablecido', mesero.nombre+': '+r.pin+' (guárdalo, no se mostrará de nuevo)'); }
      else pushToast('⚠️ No se pudo restablecer','Revisa tu conexión e intenta de nuevo.');
      break;
    }
    case 'mesero-toggle-estado': {
      const mesero=getMesero(state,arg);
      const nuevo = mesero.estado==='activo'?'inactivo':'activo';
      const r = await toggleEstadoMesero(arg, nuevo);
      if(r.ok){
        necesitaResync=true;
        if(nuevo==='inactivo' && ui.mesero.logueado===arg){
          ui.mesero.logueado=null;
          pushToast('🔒 Sesión cerrada', mesero.nombre+' fue desactivado.');
        }
      } else pushToast('⚠️ No se pudo guardar','Revisa tu conexión e intenta de nuevo.');
      break;
    }

    /* ---- ventas ---- */
    case 'ventas-exportar-csv': exportarVentasCsv(); return;
    case 'ventas-imprimir-resumen': {
      const pagados=Object.keys(state.pedidos).map(function(id){return state.pedidos[id];}).filter(function(p){return p.estadoCuenta==='pagado';});
      const totalVendido=pagados.reduce(function(a2,p){return a2+totalesPedido(p).total;},0);
      const html='<div class="comprobante-paper"><div class="cp-center"><b>Ventas del día</b><br>'+esc(fechaHoy())+'</div><hr>'+
        pagados.map(function(p){ const mesa=getMesa(state,p.idMesa); return '<div class="cp-row"><span>'+p.id+' · Mesa '+mesa.numero+'</span><span>'+money(totalesPedido(p).total)+'</span></div>'; }).join('')+
        '<hr><div class="cp-row"><b>TOTAL</b><b>'+money(totalVendido)+'</b></div></div>';
      imprimir(html);
      break;
    }

    default: return;
  }
  if(necesitaResync){
    const r = await syncFromSupabase();
    if(!r.ok) pushToast('⚠️ Sin conexión','No se pudo confirmar con el servidor. Verifica tu internet.');
  }
  render();
}

function exportarVentasCsv(){
  const pagados=Object.keys(state.pedidos).map(function(id){return state.pedidos[id];}).filter(function(p){return p.estadoCuenta==='pagado';});
  let csv='pedido,mesa,mesero,hora_pago,forma_pago,subtotal,servicio,descuento,total\n';
  pagados.forEach(function(p){
    const mesa=getMesa(state,p.idMesa); const mesero=getMesero(state,p.meseroPrincipal); const tot=totalesPedido(p);
    const formas=p.pagos.map(function(pg){return pg.formaPago;}).join('/');
    csv += [p.id, mesa.numero, '"'+mesero.nombre+'"', horaCorta(p.pagadoEn||Date.now()), formas, tot.subtotal, tot.servicio, tot.descuento, tot.total].join(',')+'\n';
  });
  (async function(){
    try{
      if(window.claude && typeof window.claude.use==='function'){
        const downloads=await window.claude.use('downloads');
        if(downloads){
          await downloads.save({filename:'ventas-'+(new Date().toISOString().slice(0,10))+'.csv', data:csv});
          pushToast('⬇ Exportado','El archivo CSV se envió para guardar.');
          return;
        }
      }
      pushToast('⚠️ Exportación no disponible','Esta vista no admite descargas de archivo.');
    }catch(e){
      pushToast('⚠️ No se pudo exportar','Intenta de nuevo en unos segundos.');
    }
  })();
}

/* funciones puente usadas por atributos inline (cálculo en vivo, sin re-render completo) */
window.__actualizarCambio=function(){
  const mesa=getMesa(state,ui.admin.facturaMesa);
  if(!mesa||!mesa.idPedidoActivo) return;
  const pedido=getPedido(state,mesa.idPedidoActivo);
  const tot=totalesPedido(pedido);
  const recEl=document.getElementById('recibido-input');
  const out=document.getElementById('cambio-calc');
  if(!recEl||!out) return;
  const recibido=parseFloat(recEl.value||'0');
  if(recibido<=0){ out.textContent=''; return; }
  const cambio=recibido-tot.total;
  out.textContent = cambio>=0 ? ('Cambio: '+money(cambio)) : ('Faltan '+money(-cambio));
};
window.__aplicarDescuento=function(val){
  const mesa=getMesa(state,ui.admin.facturaMesa);
  if(!mesa||!mesa.idPedidoActivo) return;
  const pedido=getPedido(state,mesa.idPedidoActivo);
  aplicarServicioDescuento(state,pedido.id,{descuento:Math.max(0,parseFloat(val||'0'))});
  render();
};
window.__filtrarProductos=function(val){
  ui.admin.productosBusqueda=val;
  render();
  setTimeout(function(){
    const el=document.getElementById('productos-busqueda-input');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  },0);
};

/* delegación de eventos */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  if(el.hasAttribute('disabled')) return;
  Promise.resolve(manejarAccion(el)).catch(function(err){
    pushToast('⚠️ Algo salió mal', 'Intenta de nuevo. Si persiste, revisa tu conexión.');
  });
});

/* el modal de confirmación de envío se renderiza mediante una capa aparte */
const _origRenderMesero = renderMesero;
renderMesero = function(){
  _origRenderMesero();
  if(ui.mesero.logueado && ui.mesero.__confirmEnvio){
    const root=document.getElementById('vista-mesero');
    root.insertAdjacentHTML('beforeend', modalConfirmarEnvio());
  }
};

/* ============================================================
   10) ARRANQUE
   ============================================================ */
async function arrancar(){
  render(); // primer pintado: pantalla de "falta configurar" o "cargando"
  if(!SUPABASE_CONFIGURADO) return;
  const r = await syncFromSupabase();
  if(r.ok){
    ui.cargando = false;
    iniciarTiempoReal();
  } else {
    ui.cargando = false;
    ui.errorConexion = true;
  }
  render();
}
arrancar();
tick();
})();
</script>
